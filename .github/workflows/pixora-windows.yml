name: Build Pixora for Windows

on:
  workflow_dispatch:
  push:
    branches: [pixora-preview]
    paths:
      - "pixora/desktop/**"
      - ".github/workflows/pixora-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pixora/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pixora-preview
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Pixora-Windows-Installer
          path: pixora/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
