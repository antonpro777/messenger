<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Веб-Мессенджер</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .messenger-container {
            display: flex;
            width: 90vw;
            height: 90vh;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .sidebar {
            width: 300px;
            background: #252526;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .profile-header {
            padding: 15px;
            background: #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        /* Стили для блока поиска */
        .search-box {
            padding: 10px 15px;
            background: #252526;
            border-bottom: 1px solid #333;
        }
        .search-box input {
            width: 100%;
            padding: 8px 10px;
            background: #1e1e1e;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            outline: none;
        }
        .search-box input:focus {
            border-color: #0088cc;
        }
        .user-list {
            flex: 1;
            overflow-y: auto;
        }
        .settings-panel {
            padding: 15px;
            background: #222;
            border-top: 1px solid #333;
        }
        .settings-panel input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }
        .chat-header {
            padding: 15px;
            background: #2d2d2d;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-input-box {
            padding: 15px;
            background: #252526;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        .chat-input-box input {
            flex: 1;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }
        .chat-input-box button {
            padding: 10px 20px;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .chat-input-box button:hover {
            background: #006699;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            color: white;
        }
        .user-item {
            padding: 12px 15px;
            border-bottom: 1px solid #2d2d2d;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-item:hover {
            background: #2a2d2e;
        }
        .user-item.active {
            background: #37373d;
        }
        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 8px;
            word-break: break-word;
        }
        .message.incoming {
            background: #262626;
            align-self: flex-start;
        }
        .message.outgoing {
            background: #005c8a;
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div class="messenger-container">
        <!-- Левая панель -->
        <div class="sidebar">
            <div class="profile-header">
                <div>
                    <h3 id="myUsername">{{ current_user.username if current_user is defined else 'Гость' }}</h3>
                    <p id="myStatusText" style="font-size: 12px; margin: 2px 0 0; opacity: 0.8;">{{ current_user.status if current_user is defined else '' }}</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="toggleProfileModal()" title="Настройки профиля" style="background: transparent; border: none; color: white; cursor: pointer; font-size: 16px;">⚙️</button>
                    <a href="/logout" title="Выйти" style="color: white; text-decoration: none; font-size: 18px;">🚪</a>
                </div>
            </div>
            
            <!-- Поле поиска пользователей -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск по имени..." oninput="filterUsers()">
            </div>

            <div class="user-list" id="userList">
                <!-- Заполняется через JS -->
            </div>

            <!-- Настройки громкости звука -->
            <div class="settings-panel">
                <label>🔊 Громкость уведомлений: <span id="volVal">50</span>%</label>
                <input type="range" id="volumeRange" min="0" max="100" value="50" oninput="updateVolume(this.value)">
            </div>
        </div>

        <!-- Правая панель (Чат) -->
        <div class="chat-area" id="chatArea" style="display: none;">
            <div class="chat-header">
                <div>
                    <h4 id="activeChatName" style="margin: 0;">Выберите чат</h4>
                    <span id="activeUserStatus" style="font-size: 11px; color: gray;"></span>
                </div>
                <button id="blockBtn" onclick="toggleBlockUser()" style="background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Заблокировать</button>
            </div>
            <div class="messages-box" id="messagesBox"></div>
            <div class="chat-input-box">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования профиля -->
    <div id="profileModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Редактирование профиля</h3>
            <label>Ваш статус:</label>
            <input type="text" id="newStatusInput" value="{{ current_user.status if current_user is defined else '' }}" style="width:100%; padding:8px; margin:10px 0; box-sizing:border-box;">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="toggleProfileModal()" style="padding: 6px 12px;">Отмена</button>
                <button onclick="saveProfile()" style="padding: 6px 12px; background: #0088cc; color: white; border: none; border-radius: 4px;">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- JavaScript с логикой поиска -->
    <script>
        let notificationVolume = 0.5;

        function updateVolume(val) {
            notificationVolume = val / 100;
            document.getElementById('volVal').innerText = val;
        }

        function toggleProfileModal() {
            const modal = document.getElementById('profileModal');
            modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
        }

        function saveProfile() {
            const newStatus = document.getElementById('newStatusInput').value;
            document.getElementById('myStatusText').innerText = newStatus;
            toggleProfileModal();
        }

        function toggleBlockUser() {
            alert('Функция блокировки будет связана с Supabase');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const box = document.getElementById('messagesBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message outgoing';
            msgDiv.innerText = text;
            box.appendChild(msgDiv);

            input.value = '';
            box.scrollTop = box.scrollHeight;
        }

        // Функция фильтрации списка пользователей по введенному тексту
        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const userItems = document.querySelectorAll('.user-item');

            userItems.forEach(item => {
                const username = item.getAttribute('data-username').toLowerCase();
                if (username.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Загрузка списка пользователей
        window.onload = function() {
            const userList = document.getElementById('userList');
            const dummyUsers = [
                { id: 1, username: 'Александр', status: 'В сети' },
                { id: 2, username: 'Мария', status: 'Отошла' },
                { id: 3, username: 'Алексей', status: 'Был недавно' },
                { id: 4, username: 'Екатерина', status: 'В сети' }
            ];

            dummyUsers.forEach(user => {
                const item = document.createElement('div');
                item.className = 'user-item';
                // Сохраняем имя в дата-атрибут для удобного поиска
                item.setAttribute('data-username', user.username);
                item.innerHTML = `<span>${user.username}</span><span style="font-size:10px; color:gray;">${user.status}</span>`;
                
                item.onclick = function() {
                    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    document.getElementById('activeChatName').innerText = user.username;
                    document.getElementById('activeUserStatus').innerText = user.status;
                    document.getElementById('chatArea').style.display = 'flex';
                };
                userList.appendChild(item);
            });
        };
    </script>
</body>
</html>
