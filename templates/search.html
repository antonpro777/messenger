<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск пользователей</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f5; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background: #fff; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .header { padding: 15px; background: #f7f9fa; border-bottom: 1px solid #dbdbdb; display: flex; gap: 10px; align-items: center; }
        .header input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #dbdbdb; outline: none; font-size: 14px; }
        .header a { color: #0088cc; text-decoration: none; font-size: 14px; }
        .results { flex: 1; overflow-y: auto; }
        .user-card { padding: 12px 15px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; }
        .user-card:hover { background: #f9f9f9; }
        .no-results { text-align: center; color: gray; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <form action="{{ url_for('search_users') }}" method="GET" style="display:flex; flex:1; gap:10px;">
                <input type="text" name="q" value="{{ query }}" placeholder="Поиск по имени или юзернейму..." autocomplete="off" autofocus>
                <button type="submit" style="display:none;"></button>
            </form>
            <a href="{{ url_for('index') }}">Назад</a>
        </div>
        <div class="results">
            {% for u in users %}
                <a href="{{ url_for('view_profile', user_id=u.id) }}" class="user-card">
                    <div>
                        <div style="font-weight: 500;">{{ u.name }}</div>
                        <div style="font-size: 13px; color: gray;">@{{ u.username }}</div>
                    </div>
                    <div style="font-size: 12px; color: {% if u.status == 'В сети' %}green{% else %}gray{% endif %};">{{ u.status }}</div>
                </a>
            {% else %}
                {% if query %}
                    <div class="no-results">Ничего не найдено</div>
                {% else %}
                    <div class="no-results">Введите запрос для поиска</div>
                {% endif %}
            {% endfor %}
        </div>
    </div>
</body>
</html>
